version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Application
      EXPMS_SECRET_KEY: "${EXPMS_SECRET_KEY:?set EXPMS_SECRET_KEY in .env - generate with: openssl rand -hex 32}"
      EXPMS_DATABASE_URL: sqlite:////app/data/expms.db
      EXPMS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

      # Storage: 'local' or 'gdrive'
      EXPMS_STORAGE_TYPE: ${EXPMS_STORAGE_TYPE:-local}

      # Local storage (used when EXPMS_STORAGE_TYPE=local)
      EXPMS_UPLOAD_DIR: /app/data/uploads
      EXPMS_MAX_UPLOAD_SIZE_MB: 15

      # Google Drive storage (used when EXPMS_STORAGE_TYPE=gdrive)
      EXPMS_GDRIVE_FOLDER_ID: ${EXPMS_GDRIVE_FOLDER_ID:-}
      EXPMS_GDRIVE_CREDENTIALS_PATH: /app/gdrive-credentials.json

    volumes:
      - ./data:/app/data
      # Uncomment when EXPMS_STORAGE_TYPE=gdrive (file must exist first)
      # - ./gdrive-credentials.json:/app/gdrive-credentials.json:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

