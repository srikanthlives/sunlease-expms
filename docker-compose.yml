version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Application
      EXPMS_SECRET_KEY: "${EXPMS_SECRET_KEY:?set EXPMS_SECRET_KEY in .env - generate with: openssl rand -hex 32}"
      EXPMS_DATABASE_URL: sqlite:////data/expms.db
      EXPMS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

      # Storage: 'local' or 'r2'
      EXPMS_STORAGE_TYPE: ${EXPMS_STORAGE_TYPE:-local}

      # Local storage (used when EXPMS_STORAGE_TYPE=local)
      EXPMS_UPLOAD_DIR: /data/uploads
      EXPMS_MAX_UPLOAD_SIZE_MB: 15

      # Cloudflare R2 storage (used when EXPMS_STORAGE_TYPE=r2)
      EXPMS_R2_ACCOUNT_ID: ${EXPMS_R2_ACCOUNT_ID:-}
      EXPMS_R2_ACCESS_KEY_ID: ${EXPMS_R2_ACCESS_KEY_ID:-}
      EXPMS_R2_SECRET_ACCESS_KEY: ${EXPMS_R2_SECRET_ACCESS_KEY:-}
      EXPMS_R2_BUCKET_NAME: ${EXPMS_R2_BUCKET_NAME:-}
      EXPMS_R2_ENDPOINT_URL: ${EXPMS_R2_ENDPOINT_URL:-}
      EXPMS_R2_PREFIX: ${EXPMS_R2_PREFIX:-SUNLEASE}

    volumes:
      - ./data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

